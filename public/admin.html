<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080304"><title>Crystal Deals — менеджер</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#080304;--card:#140709;--card2:#1b0a0d;--line:#3a1017;--line2:#5c1a25;--tx:#fdeaec;--mu:#b08a90;--red:#ff2d4d;--red2:#b3122b;--ok:#3ddc97;--wa:#ffb547}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Manrope,system-ui,sans-serif;min-height:100vh;background-image:radial-gradient(700px 420px at 90% -8%,rgba(255,45,77,.20),transparent),radial-gradient(520px 380px at -5% 30%,rgba(179,18,43,.16),transparent);background-attachment:fixed}
h1,h2,h3,.lg{font-family:Unbounded,Manrope,sans-serif;font-weight:700;margin:0}
.hid{display:none!important}.m{color:var(--mu);font-size:12.5px}.tx{margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}
input,select,textarea{font:inherit;color:var(--tx);background:#0c0405;border:1px solid var(--line);border-radius:11px;padding:11px 13px;min-height:44px;outline:none;transition:border-color .2s,box-shadow .2s;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(255,45,77,.18)}
textarea{width:100%;resize:vertical}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:11px;padding:11px 18px;min-height:44px;font-weight:800;color:#fff;background:linear-gradient(120deg,var(--red),var(--red2));box-shadow:0 6px 18px rgba(255,45,77,.25);transition:transform .15s,filter .2s}
.btn:hover{filter:brightness(1.1)}.btn:active{transform:scale(.97)}
.btn.g{background:var(--card2);border:1px solid var(--line2);box-shadow:none;color:var(--tx)}
.btn.ok{background:linear-gradient(120deg,#2fcf8a,#169c64);box-shadow:0 6px 18px rgba(61,220,151,.2)}
.btn.no{background:transparent;border:1px solid var(--red);color:var(--red);box-shadow:none}
.btn.sm{padding:8px 14px;min-height:38px;font-size:13px}
/* login */
#lgv{min-height:100vh;display:grid;place-items:center;padding:20px}
.lgc{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line2);border-radius:22px;padding:30px 24px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6),0 0 60px rgba(255,45,77,.12)}
.lgc svg{width:62px;margin-bottom:10px;filter:drop-shadow(0 6px 18px rgba(255,45,77,.55))}
.lgc h1{font-size:19px}.lgc p{color:var(--mu);margin:6px 0 18px}.lgc input{width:100%;margin-bottom:12px;text-align:center}.lgc .btn{width:100%}
.err{color:var(--red);min-height:20px;font-size:13px;margin-top:10px}
/* top */
header{position:sticky;top:0;z-index:20;background:rgba(8,3,4,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hb{max-width:960px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.lg{display:flex;align-items:center;gap:9px;font-size:14px;flex:1;min-width:0;white-space:nowrap}.lg svg{width:24px;flex:none}.lg span{color:var(--red)}
.tabs{max-width:960px;margin:auto;display:flex;gap:6px;padding:0 14px 10px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);color:var(--mu);border-radius:11px;padding:9px 14px;font-weight:700;font-size:13.5px;transition:.2s}
.tab.on{color:#fff;background:linear-gradient(120deg,var(--red),var(--red2));border-color:transparent;box-shadow:0 6px 18px rgba(255,45,77,.28)}
.nb{min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:inline-grid;place-items:center;padding:0 6px}.tab.on .nb{background:#fff;color:var(--red2)}
main{max-width:960px;margin:auto;padding:16px 14px 60px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;color:var(--tx);transition:.2s}
.stat:hover{border-color:var(--red)}.stat b{display:block;font:700 24px Unbounded,sans-serif}.stat span{color:var(--mu);font-size:12px}.stat.hot b{color:var(--red)}
/* cards */
.ttl{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:2px 0 12px}.ttl h2{font-size:16px}
.c{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;overflow-wrap:anywhere;transition:border-color .2s}
.c:hover{border-color:var(--line2)}
.c.att{border-color:var(--red);box-shadow:0 0 0 1px rgba(255,45,77,.25),0 8px 28px rgba(255,45,77,.10)}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.hd b{font-size:15px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.c .row{margin-top:12px}.row>*{min-width:0}
.fl{flex:1 1 200px}
.chip{display:inline-block;border:1px solid currentColor;border-radius:99px;padding:2px 10px;font-size:11.5px;font-weight:800;white-space:nowrap}
.s-wait,.s-pending{color:var(--wa)}.s-paid,.s-handed{color:#ff7a8e}.s-done,.s-ok{color:var(--ok)}.s-cancel,.s-rejected,.s-no,.s-exp{color:var(--mu)}.s-hide{color:var(--wa)}
.fs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.f{border:1px solid var(--line);background:transparent;color:var(--mu);border-radius:99px;padding:7px 14px;font-weight:700;font-size:13px}
.f.on{color:#fff;border-color:var(--red);background:rgba(255,45,77,.16)}
.srch{flex:1 1 180px;border-radius:99px!important}
.stars{color:var(--wa);letter-spacing:2px;margin-top:6px}
.empty{text-align:center;color:var(--mu);padding:30px 10px;border:1px dashed var(--line);border-radius:16px}
.form{display:grid;gap:10px}.form .row{margin:0}.c .form{margin-top:4px}
.amt{font:700 15px Unbounded,sans-serif;white-space:nowrap}
.hist{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.u{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:60;display:grid;place-items:center;padding:16px}
.md{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.7)}.md p{margin:0 0 14px;font-weight:700}.md .row .btn{flex:1}
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);background:var(--card2);border:1px solid var(--red);padding:12px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:90;max-width:92vw;pointer-events:none;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:480px){.lg span{display:none}}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.btn{padding:11px 14px}.c .row .btn{flex:1 1 auto}}
</style></head><body>

<div id="lgv"><div class="lgc">
<svg viewBox="0 0 100 100"><polygon points="50,4 82,34 50,50 18,34" fill="#ff5a73"/><polygon points="18,34 50,50 50,96" fill="#ff2d4d"/><polygon points="82,34 50,50 50,96" fill="#a30f26"/></svg>
<h1>Crystal Deals</h1><p>Панель менеджера</p>
<input id="pw" type="password" placeholder="Пароль администратора" autocomplete="current-password" onkeydown="if(event.key=='Enter')ld(1)">
<button class="btn" onclick="ld(1)">Войти</button><div class="err" id="le"></div>
</div></div>

<div id="apv" class="hid">
<header><div class="hb"><div class="lg"><svg viewBox="0 0 100 100"><polygon points="50,4 82,34 50,50 18,34" fill="#ff5a73"/><polygon points="18,34 50,50 50,96" fill="#ff2d4d"/><polygon points="82,34 50,50 50,96" fill="#a30f26"/></svg>Crystal Deals<span>· менеджер</span></div>
<button class="btn g sm" onclick="ld()">Обновить</button><button class="btn g sm" onclick="out()">Выйти</button></div><div class="tabs" id="tabs"></div></header>
<main id="o"></main>
</div>
<div id="toast"></div>

<script>
const $=s=>document.querySelector(s),E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let P=sessionStorage.getItem('ap')||'',D=null,tab=sessionStorage.getItem('at')||'',rf='pending',df='att',wf='pending',uq='',dq='',pre='';
const SL={wait:'Ожидает оплаты',paid:'Оплачена',handed:'Товар передан',done:'Завершена',cancel:'Отменена'},
WL={pending:'В обработке',done:'Выплачено',rejected:'Отклонено'},
PL={wait:'Ожидает',done:'Зачислено',exp:'Истекло',cancel:'Отменено'},
RL={pending:'На проверке',ok:'Одобрен',no:'Отклонён'};
const dt=t=>new Date(t).toLocaleString('ru',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
const f=n=>Object.entries(n).filter(([k,v])=>v>0).map(([k,v])=>v+' '+k).join(' · ')||'0';
function toast(t,ms){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),ms||2600)}
async function q(a,b){try{const r=await fetch('/api/admin/'+a,{method:'POST',headers:{'Content-Type':'application/json','x-admin':P},body:JSON.stringify(b||{})});return await r.json()}catch(e){return{err:'Нет связи с сервером'}}}
function ask(t,inp){return new Promise(res=>{const o=document.createElement('div');o.className='ov';
o.innerHTML=`<div class="md"><p>${E(t)}</p>${inp!=null?`<textarea id="mi" rows="3" maxlength="300">${E(inp)}</textarea>`:''}<div class="row" style="margin-top:14px"><button class="btn g" data-v="0">Отмена</button><button class="btn" data-v="1">ОК</button></div></div>`;
o.onclick=e=>{const b=e.target.closest('button');if(e.target==o||(b&&b.dataset.v=='0')){o.remove();res(null)}else if(b){const v=inp!=null?$('#mi').value:true;o.remove();res(v)}};document.body.appendChild(o);const i=$('#mi');if(i)i.focus()})}
function out(){sessionStorage.removeItem('ap');P='';D=null;$('#apv').classList.add('hid');$('#lgv').classList.remove('hid');$('#pw').value=''}
async function ld(first,silent){if(first)P=$('#pw').value;if(!P)return;const j=await q('list');
if(j.err){if(!D){$('#le').textContent=j.err;$('#apv').classList.add('hid');$('#lgv').classList.remove('hid')}else if(!silent)toast(j.err);return}
sessionStorage.setItem('ap',P);j.reviews.forEach(r=>r.st=r.st||'ok');
const same=D&&JSON.stringify(D)==JSON.stringify(j);D=j;
if(same&&silent)return;
$('#lgv').classList.add('hid');$('#apv').classList.remove('hid');$('#le').textContent='';
if(!tab){const c=cnt();tab=c.r?'reviews':c.w?'wd':'deals'}
if(!c0){c0=1;df=cnt().d?'att':'all'}
render()}
let c0=0;
function cnt(){return{r:D.reviews.filter(r=>r.st=='pending').length,w:D.wd.filter(x=>x.st=='pending').length,d:D.deals.filter(d=>d.st=='paid'||d.st=='handed').length}}
function go(t){tab=t;sessionStorage.setItem('at',t);render();scrollTo(0,0)}
function render(){const c=cnt(),T=[['reviews','Отзывы',c.r],['wd','Выводы',c.w],['deals','Сделки',c.d],['bal','Баланс'],['new','Новая сделка'],['ton','TON'],['users','Пользователи']];
$('#tabs').innerHTML=T.map(([k,n,b])=>`<button class="tab ${k==tab?'on':''}" onclick="go('${k}')">${n}${b?`<i class="nb">${b}</i>`:''}</button>`).join('');
const st=[['reviews','Отзывы на проверке',c.r],['wd','Выводы в обработке',c.w],['deals','Сделки в работе',c.d],['users','Пользователей',D.users.length]];
$('#o').innerHTML=`<div class="stats">${st.map(([k,n,v])=>`<button class="stat ${v&&k!='users'?'hot':''}" onclick="go('${k}')"><b>${v}</b><span>${n}</span></button>`).join('')}</div>`+({reviews:vRv,wd:vWd,deals:vDl,bal:vBal,new:vNew,ton:vTon,users:vUs}[tab]||vRv)();
if(pre&&tab=='bal'){$('#cn').value=pre;pre='';$('#ca').focus()}}
const none=t=>`<div class="empty">${t}</div>`;
const fch=(cur,arr,fn)=>`<div class="fs">${arr.map(([k,n])=>`<button class="f ${k==cur?'on':''}" onclick="${fn}('${k}')">${n}</button>`).join('')}</div>`;

/* ---- reviews ---- */
function vRv(){const c=cnt();return`<div class="ttl"><h2>Добавить отзыв пользователю</h2></div><div class="c"><div class="form"><div class="row"><input class="fl" id="rt" list="ul" placeholder="Кому (ник пользователя)" autocomplete="off"><input class="fl" id="rfm" placeholder="От кого (любой ник)" autocomplete="off" maxlength="30"></div>
<div class="row"><select id="rs"><option value="5">★★★★★ 5</option><option value="4">★★★★☆ 4</option><option value="3">★★★☆☆ 3</option><option value="2">★★☆☆☆ 2</option><option value="1">★☆☆☆☆ 1</option></select><span class="m">Отзыв сразу появится в профиле</span></div>
<textarea id="rx" rows="3" maxlength="500" placeholder="Текст отзыва"></textarea><button class="btn" onclick="ar()">Добавить отзыв</button></div>${ul()}</div>
<div class="ttl" style="margin-top:18px"><h2>Отзывы</h2><span class="m">Новый отзыв от пользователя виден на сайте только после одобрения</span></div>
${fch(rf,[['pending','На проверке'+(c.r?' ('+c.r+')':'')],['ok','Одобренные'],['no','Отклонённые'],['all','Все']],'sRf')}<div id="lst">${rvL()}</div>`}
function sRf(k){rf=k;render()}
function rvL(){const L=D.reviews.filter(r=>rf=='all'||r.st==rf);
return L.map(r=>`<div class="c ${r.st=='pending'?'att':''}"><div class="hd"><div><b>${E(r.u)}</b> <span class="m">→ ${E(r.to||'—')}</span></div><span><span class="chip s-${r.st}">${RL[r.st]}</span>${r.hide?' <span class="chip s-hide">скрыт</span>':''}</span></div>
<div class="stars">${'★'.repeat(r.stars)}${'☆'.repeat(5-r.stars)}</div><div class="tx">${E(r.x)}</div>${r.reply?`<div class="m">Ответ Crystal: ${E(r.reply)}</div>`:''}<div class="m">${r.by=='admin'?'Добавлен админом':'Сделка #'+E(r.deal)} · ${dt(r.t)}</div>
<div class="row">${r.st=='pending'?`<button class="btn ok sm" onclick="a('review.ok','${r.id}','Отзыв одобрен и опубликован')">Одобрить</button><button class="btn no sm" onclick="a('review.no','${r.id}','Отзыв отклонён')">Отклонить</button>`
:r.st=='ok'?`<button class="btn g sm" onclick="a('review.hide','${r.id}')">${r.hide?'Показать':'Скрыть'}</button><button class="btn g sm" onclick="rp('${r.id}')">Ответить</button><button class="btn no sm" onclick="a('review.no','${r.id}','Отзыв отклонён')">Отклонить</button>`
:`<button class="btn ok sm" onclick="a('review.ok','${r.id}','Отзыв одобрен и опубликован')">Одобрить</button>`}</div></div>`).join('')||none(rf=='pending'?'Нет отзывов на проверке 🎉':'Здесь пока пусто')}

/* ---- withdrawals ---- */
function vWd(){return`<div class="ttl"><h2>Заявки на вывод</h2></div>${fch(wf,[['pending','В обработке'],['all','Все']],'sWf')}<div id="lst">${wdL()}</div>`}
function sWf(k){wf=k;render()}
function wdL(){const L=D.wd.filter(w=>wf=='all'||w.st=='pending');
return L.map(w=>`<div class="c ${w.st=='pending'?'att':''}"><div class="hd"><div><b>#${w.id}</b> · ${E(w.u)}</div><span class="chip s-${w.st}">${WL[w.st]||E(w.st)}</span></div>
<div class="amt" style="margin-top:8px">${w.amt} <span class="m">RUB-экв.</span></div><div class="m">${E(w.rq)} · ${dt(w.t)}</div>
${w.st=='pending'?`<div class="row"><button class="btn ok sm" onclick="a('wd.done','${w.id}','Отметить заявку как выплаченную?')">Выплачено</button><button class="btn no sm" onclick="a('wd.reject','${w.id}','Отклонить заявку и вернуть деньги на баланс?')">Отклонить и вернуть</button></div>`:''}</div>`).join('')||none('Заявок нет')}

/* ---- deals ---- */
function vDl(){const c=cnt();return`<div class="ttl"><h2>Сделки</h2></div>${fch(df,[['att','Требуют внимания'+(c.d?' ('+c.d+')':'')],['all','Все']],'sDf')}<div class="fs"><input class="srch" id="dq" placeholder="Поиск: номер, ник, товар" value="${E(dq)}" oninput="dq=this.value;$('#lst').innerHTML=dlL()"></div><div id="lst">${dlL()}</div>`}
function sDf(k){df=k;render()}
function dlL(){const s=dq.trim().toLowerCase(),L=D.deals.filter(d=>(df=='all'||d.st=='paid'||d.st=='handed')&&(!s||[d.id,d.seller,d.buyer,d.lk,d.type].some(x=>String(x||'').toLowerCase().includes(s))));
return L.map(d=>`<div class="c ${d.st=='paid'||d.st=='handed'?'att':''}"><div class="hd"><div><b>#${d.id}</b> · ${E(d.type)}</div><span class="chip s-${d.st}">${SL[d.st]||E(d.st)}</span></div>
<div class="amt" style="margin-top:8px">${d.ca&&d.cur?d.ca+' '+E(d.cur):d.amt+' <span class="m">RUB-экв.</span>'}</div>
<div class="m">${E(d.seller)} → ${E(d.buyer||'—')} · сообщений: ${d.msgs} · ${dt(d.t)}</div><div class="m">${E(d.lk)}</div>
${d.st=='paid'||d.st=='handed'?`<div class="row"><button class="btn ok sm" onclick="a('deal.release','${d.id}','Выплатить деньги продавцу?')">Выплатить продавцу</button><button class="btn no sm" onclick="a('deal.refund','${d.id}','Вернуть деньги покупателю?')">Вернуть покупателю</button></div>`:''}</div>`).join('')||none(df=='att'?'Нет сделок, которые ждут решения':'Сделок не найдено')}

/* ---- balance ---- */
const cur=()=>D.cur.map(c=>`<option>${c}</option>`).join(''),ul=()=>`<datalist id="ul">${D.users.map(u=>`<option value="${E(u.nick)}">`).join('')}</datalist>`;
function vBal(){return`<div class="ttl"><h2>Пополнить / списать баланс</h2></div><div class="c"><div class="form"><div class="row"><input class="fl" id="cn" list="ul" placeholder="Ник пользователя" autocomplete="off"><select id="cc">${cur()}</select></div>
<div class="row"><input class="fl" id="ca" placeholder="Сумма (минус = списать)" inputmode="decimal" onkeydown="if(event.key=='Enter')cr()"><button class="btn" onclick="cr()">Зачислить</button></div></div>${ul()}</div>
<div class="ttl" style="margin-top:18px"><h2>Последние операции</h2></div>${D.credits.map(c=>`<div class="c u"><span><b>${E(c.u)}</b> <span class="m">${dt(c.t)}</span></span><span class="amt" style="color:${c.amt>0?'var(--ok)':'var(--red)'}">${c.amt>0?'+':''}${c.amt} ${c.cur}</span></div>`).join('')||none('Пока нет операций')}`}

/* ---- new deal ---- */
function vNew(){return`<div class="ttl"><h2>Добавить сделку пользователям</h2></div><div class="c"><div class="form"><div class="row"><input class="fl" id="ds" list="ul" placeholder="Продавец (ник)" autocomplete="off"><input class="fl" id="db" list="ul" placeholder="Покупатель (необязательно)" autocomplete="off"></div>
<div class="row"><select class="fl" id="dt"><option>NFT</option><option>NFT юзернейм</option><option>NFT номер</option><option>Аккаунт</option><option selected>Разное</option></select><select id="dc">${cur()}</select><input class="fl" id="da" placeholder="Сумма" inputmode="decimal"></div>
<input id="dl" placeholder="Товар: ссылка, юзернейм, номер или текст"><button class="btn" onclick="ad()">Создать сделку</button></div>${ul()}
<div class="m" style="margin-top:10px">Сделка создаётся как обычная: покупатель платит, продавец передаёт товар, дальше всё по шагам.</div></div>
<div class="ttl" style="margin-top:18px"><h2>Добавить завершённые сделки в профиль</h2></div><div class="c"><div class="form"><div class="row"><input class="fl" id="bn" list="ul" placeholder="Ник пользователя" autocomplete="off"><input id="bc" placeholder="Сколько" inputmode="numeric" size="8" onkeydown="if(event.key=='Enter')bo()"></div><button class="btn" onclick="bo()">Добавить сделки</button></div>
<div class="m" style="margin-top:10px">Сделки сразу считаются успешными: растут счётчики «Всего» и «Успешных», процент успешности и ранг. В списке «Мои сделки» они не появляются. Чтобы убрать, введите число с минусом.</div></div>`}

/* ---- TON ---- */
function vTon(){return`<div class="ttl"><h2>Пополнения TON</h2></div>${D.pay.map(p=>`<div class="c"><div class="hd"><div><b>${E(p.c)}</b> · ${E(p.u)}</div><span class="chip s-${p.st}">${PL[p.st]||E(p.st)}</span></div><div class="amt" style="margin-top:8px">${p.amt} TON</div><div class="m">${dt(p.t)}</div></div>`).join('')||none('Пополнений нет')}`}

/* ---- users ---- */
function vUs(){return`<div class="ttl"><h2>Пользователи (${D.users.length})</h2></div><div class="fs"><input class="srch" placeholder="Поиск по нику" value="${E(uq)}" oninput="uq=this.value;$('#lst').innerHTML=usL()"></div><div id="lst">${usL()}</div>`}
function usL(){const s=uq.trim().toLowerCase();return D.users.filter(u=>!s||u.nick.toLowerCase().includes(s)).map(u=>`<div class="c u"><div><b>${E(u.nick)}</b><div class="m">${E(f(u.w))}${u.bonus?' · добавлено сделок: '+u.bonus:''}</div></div><button class="btn g sm" onclick="pre=this.dataset.n;go('bal')" data-n="${E(u.nick)}">Баланс</button></div>`).join('')||none('Никого не нашли')}

/* ---- actions ---- */
async function a(m,id,t){if(t&&m!='review.ok'&&m!='review.no'&&!await ask(t))return;const j=await q(m,{id});if(j.err)toast(j.err);else if(t&&(m=='review.ok'||m=='review.no'))toast(t);else toast('Готово');ld()}
async function rp(id){const r=D.reviews.find(x=>x.id==id),x=await ask('Ответ от Crystal',r&&r.reply||'');if(x===null)return;const j=await q('review.reply',{id,x});if(j.err)toast(j.err);else toast('Ответ сохранён');ld()}
async function ar(){const j=await q('review.add',{to:$('#rt').value,from:$('#rfm').value,stars:$('#rs').value,x:$('#rx').value});if(j.err)return toast(j.err,4500);toast(j.msg||'Готово',4500);rf='ok';ld()}
async function bo(){const j=await q('deals.bonus',{nick:$('#bn').value,n:$('#bc').value});if(j.err)return toast(j.err,4500);toast(j.msg||'Готово',4500);ld()}
async function cr(){const j=await q('credit',{nick:$('#cn').value,cur:$('#cc').value,amt:$('#ca').value});if(j.err)return toast(j.err,4500);toast(j.msg||'Готово',4500);ld()}
async function ad(){const j=await q('deal.add',{seller:$('#ds').value,buyer:$('#db').value,type:$('#dt').value,cur:$('#dc').value,amt:$('#da').value,lk:$('#dl').value});if(j.err)return toast(j.err,4500);toast(j.msg||'Готово',4500);ld()}
if(P){$('#pw').value=P;ld(1)}
setInterval(()=>{const e=document.activeElement;if(D&&!document.hidden&&!document.querySelector('.ov')&&!(e&&/INPUT|TEXTAREA|SELECT/.test(e.tagName)))ld(0,1)},30000);
</script></body></html>
